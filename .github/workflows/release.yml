name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*' # Triggers the workflow only when you push a tag like v1.0.0, v2.1.3, etc.

# IMPORTANT: Ensure the workflow has permission to create releases
permissions:
  contents: write

jobs:
  # 1. NEW JOB: Create the release first
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # Or ${{ secrets.GITHUB_TOKEN }} if using the default

  # 2. UPDATED JOB: Build and upload to the release we just created
  release:
    needs: create-release # This is the magic line! It forces the matrix to wait for the job above.
    
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Build and Publish with electron-builder
        run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}