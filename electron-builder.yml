appId: com.cybage.attendance-scraper
productName: Cybage Tracker

asar: true
compression: maximum
removePackageScripts: true

buildDependenciesFromSource: true
npmRebuild: false
electronLanguages:
  - "en-US"

directories:
  buildResources: build
  output: dist

files:
  - "out/**/*"
  - "package.json"
  - "!**/.vscode/*"
  - "!src/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"

# -------------------------
# WINDOWS
# -------------------------
win:
  icon: build/icon.ico
  executableName: cybage-tracker
  target:
    - nsis        
    - portable    

nsis:
  artifactName: ${name}-Setup-v${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

portable:
  artifactName: ${name}-v${version}.${ext}

# -------------------------
# MACOS
# -------------------------
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  target:
    - dmg         
    - zip         

dmg:
  artifactName: ${name}-v${version}.${ext}

# -------------------------
# LINUX
# -------------------------
linux:
  icon: build/icon.png
  category: Utility
  maintainer: "Cybage Software Pvt Ltd <support@cybage.com>"
  synopsis: "Attendance tracker for Cybage employees"
  target:
    - AppImage    
    - deb

appImage:
  artifactName: ${name}-app-v${version}.${ext}

deb:
  artifactName: ${name}-v${version}.${ext}

# -------------------------
# AUTO UPDATE + GITHUB
# -------------------------
publish:
  provider: github
  owner: pavankokane
  repo: cybage-tracker